# This alias serves only the main site's management frontend. Its login page
# also reads public config/captcha endpoints guarded by storefront host routing.
# Use the already trusted main host, not an unregistered reseller domain.
# Keep browser requests same-origin and preserve normal API authentication.
proxy_pass http://127.0.0.1:18880;
proxy_http_version 1.1;
proxy_set_header Host www.qzweb.cloud;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_connect_timeout 5s;
proxy_read_timeout 60s;
proxy_next_upstream off;
