# Shared by the storefront and management HTTPS servers.
# Install as /etc/nginx/snippets/qzweb-errors.conf before reloading either server.
# Gateway errors must identify the current icon without waiting for Vue or the API.
# The versioned icon URL also replaces a favicon cached from the previous site.
location = /favicon.ico {
    alias /srv/zhixiang-front/current/user/brand/patrick-logo.png;
    types { }
    default_type image/png;
    etag off;
    if_modified_since off;
    add_header Cache-Control "no-cache, max-age=0, must-revalidate" always;
    add_header X-Content-Type-Options nosniff always;
}

# Keep the original HTTP status and familiar error body. API responses are not
# intercepted (proxy_intercept_errors remains off in qzweb-backend.conf).
error_page 403 = @qzweb_error_403;
error_page 404 = @qzweb_error_404;
error_page 500 = @qzweb_error_500;
error_page 502 = @qzweb_error_502;
error_page 503 = @qzweb_error_503;
error_page 504 = @qzweb_error_504;

location @qzweb_error_403 {
    default_type text/html;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
    return 403 '<html><head><title>403 Forbidden</title><link rel="icon" type="image/png" href="/favicon.ico?v=21e992a7"></head><body><center><h1>403 Forbidden</h1></center><hr><center>nginx/$nginx_version</center></body></html>';
}
location @qzweb_error_404 {
    default_type text/html;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
    return 404 '<html><head><title>404 Not Found</title><link rel="icon" type="image/png" href="/favicon.ico?v=21e992a7"></head><body><center><h1>404 Not Found</h1></center><hr><center>nginx/$nginx_version</center></body></html>';
}
location @qzweb_error_500 {
    default_type text/html;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
    return 500 '<html><head><title>500 Internal Server Error</title><link rel="icon" type="image/png" href="/favicon.ico?v=21e992a7"></head><body><center><h1>500 Internal Server Error</h1></center><hr><center>nginx/$nginx_version</center></body></html>';
}
location @qzweb_error_502 {
    default_type text/html;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
    return 502 '<html><head><title>502 Bad Gateway</title><link rel="icon" type="image/png" href="/favicon.ico?v=21e992a7"></head><body><center><h1>502 Bad Gateway</h1></center><hr><center>nginx/$nginx_version</center></body></html>';
}
location @qzweb_error_503 {
    default_type text/html;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
    return 503 '<html><head><title>503 Service Temporarily Unavailable</title><link rel="icon" type="image/png" href="/favicon.ico?v=21e992a7"></head><body><center><h1>503 Service Temporarily Unavailable</h1></center><hr><center>nginx/$nginx_version</center></body></html>';
}
location @qzweb_error_504 {
    default_type text/html;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
    return 504 '<html><head><title>504 Gateway Time-out</title><link rel="icon" type="image/png" href="/favicon.ico?v=21e992a7"></head><body><center><h1>504 Gateway Time-out</h1></center><hr><center>nginx/$nginx_version</center></body></html>';
}
