server {
    listen 80;
    server_name www.qzweb.cloud;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://www.qzweb.cloud$request_uri; }
}

server {
    listen 443 ssl;
    server_name www.qzweb.cloud;
    ssl_certificate /srv/zhixiang-front/shared/letsencrypt/live/www.qzweb.cloud/fullchain.pem;
    ssl_certificate_key /srv/zhixiang-front/shared/letsencrypt/live/www.qzweb.cloud/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /srv/zhixiang-front/current/user;
    index index.html;
    client_max_body_size 20m;
    access_log /var/log/nginx/qzweb-front-access.log qzweb_front;
    error_log /var/log/nginx/qzweb-front-error.log warn;
    add_header X-Content-Type-Options nosniff always;
    include /etc/nginx/snippets/qzweb-errors.conf;
    include /etc/nginx/snippets/qzweb-retired-assets.conf;

    location = /index.html {
        etag off;
        if_modified_since off;
        expires -1;
        try_files $uri =404;
    }

    location ^~ /api/ { include /etc/nginx/snippets/qzweb-backend.conf; }
    location ^~ /uploads/ { include /etc/nginx/snippets/qzweb-backend.conf; }
    location = /health { include /etc/nginx/snippets/qzweb-backend.conf; }

    # The management frontend has its own IP and port, not this hostname.
    location = /zxa-management { return 404; }
    location ^~ /zxa-management/ { return 404; }
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    # Versioned optimized public images only; HTML and API caching stay unchanged.
    location ^~ /media/storefront-20261020/ {
        try_files $uri =404;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location ~ /\. { deny all; }
    location / {
        add_header Cache-Control "no-cache";
        # /products is both a Vue route and an image directory. Only serve files.
        try_files $uri /index.html;
    }
}
