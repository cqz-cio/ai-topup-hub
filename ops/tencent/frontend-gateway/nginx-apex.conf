# Keep the bare domain out of unrelated sites on this shared server.
# Install as /etc/nginx/conf.d/qzweb-apex.conf on the Shanghai frontend host.
server {
    listen 80;
    server_name qzweb.cloud;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 308 https://www.qzweb.cloud$request_uri; }
}

server {
    listen 443 ssl;
    server_name qzweb.cloud;
    ssl_certificate /srv/zhixiang-front/shared/letsencrypt/live/qzweb.cloud/fullchain.pem;
    ssl_certificate_key /srv/zhixiang-front/shared/letsencrypt/live/qzweb.cloud/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 308 https://www.qzweb.cloud$request_uri;
}
