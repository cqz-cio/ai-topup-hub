# Append this block at the end of the Singapore sshd_config after validation.
# It applies only to the dedicated API proxy identity.
Match User zhixiang-api-proxy
    AuthenticationMethods publickey
    PubkeyAuthentication yes
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    AllowTcpForwarding local
    AllowStreamLocalForwarding no
    PermitOpen 127.0.0.1:8080
    PermitListen none
    GatewayPorts no
    PermitTTY no
    AllowAgentForwarding no
    X11Forwarding no
    PermitUserRC no
    MaxSessions 0
