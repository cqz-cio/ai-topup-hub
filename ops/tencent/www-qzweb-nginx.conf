# The shop listens on 127.0.0.1:8080. Keep this file free of private key contents.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 43.134.141.10;

    client_max_body_size 20m;
    # Serve APIs only here; public frontends use the maintained Shanghai release.
    location ^~ /api/ { include /etc/nginx/snippets/qzweb-origin-backend.conf; }
    location ^~ /uploads/ { include /etc/nginx/snippets/qzweb-origin-backend.conf; }
    location = /health { include /etc/nginx/snippets/qzweb-origin-backend.conf; }
    location = /zxa-management { return 308 https://admin.qzweb.cloud/; }
    location ~ ^/zxa-management/(.*)$ { return 308 https://admin.qzweb.cloud/$1$is_args$args; }
    location / { return 308 https://www.qzweb.cloud$request_uri; }
}

server {
    listen 80;
    listen [::]:80;
    server_name www.qzweb.cloud;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 301 https://www.qzweb.cloud$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.qzweb.cloud;

    ssl_certificate /etc/letsencrypt/live/www.qzweb.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.qzweb.cloud/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:QzwebTLS:10m;
    ssl_session_timeout 1d;

    client_max_body_size 20m;
    # Serve APIs only here; public frontends use the maintained Shanghai release.
    location ^~ /api/ { include /etc/nginx/snippets/qzweb-origin-backend.conf; }
    location ^~ /uploads/ { include /etc/nginx/snippets/qzweb-origin-backend.conf; }
    location = /health { include /etc/nginx/snippets/qzweb-origin-backend.conf; }
    location = /zxa-management { return 308 https://admin.qzweb.cloud/; }
    location ~ ^/zxa-management/(.*)$ { return 308 https://admin.qzweb.cloud/$1$is_args$args; }
    location / { return 308 https://www.qzweb.cloud$request_uri; }
}
