# Management domain for the existing Shanghai admin frontend.
# Keep the IP:18888 management server as a compatible fallback.
server {
    listen 80;
    server_name admin.qzweb.cloud;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://admin.qzweb.cloud$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name admin.qzweb.cloud;
    ssl_certificate /srv/zhixiang-front/shared/letsencrypt/live/admin.qzweb.cloud/fullchain.pem;
    ssl_certificate_key /srv/zhixiang-front/shared/letsencrypt/live/admin.qzweb.cloud/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /srv/zhixiang-front/current/admin;
    index index.html;
    client_max_body_size 20m;
    access_log /var/log/nginx/qzweb-admin-domain-access.log qzweb_front;
    error_log /var/log/nginx/qzweb-admin-domain-error.log warn;
    add_header X-Content-Type-Options nosniff always;
    include /etc/nginx/snippets/qzweb-errors.conf;

    location = /index.html {
        etag off;
        if_modified_since off;
        expires -1;
        try_files $uri =404;
    }
    location ^~ /api/ {
        include /etc/nginx/snippets/qzweb-admin-domain-backend.conf;
    }
    location ^~ /uploads/ {
        include /etc/nginx/snippets/qzweb-admin-domain-backend.conf;
    }
    location = /health {
        include /etc/nginx/snippets/qzweb-admin-domain-backend.conf;
    }
    location ^~ /brand/ {
        root /srv/zhixiang-front/current/user;
        try_files $uri =404;
    }
    location ^~ /catalog-products/ {
        root /srv/zhixiang-front/current/user;
        try_files $uri =404;
    }
    location ~* ^/products/[^/]+\.(avif|gif|jpe?g|png|svg|webp|ico)$ {
        root /srv/zhixiang-front/current/user;
        try_files $uri =404;
    }
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location ~ /\. {
        deny all;
    }
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
