<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="/media/storefront-20261020/patrick-icon.png" />
  <script data-cfasync="false">
    // Start the primary storefront wallpaper before Vue/config loading.
    // Inner pages use their own ocean wallpaper; do not compete for their bandwidth.
    try {
      const template = new URLSearchParams(location.search).get('template') || localStorage.getItem('dj-storefront-template');
      if (['www.qzweb.cloud', 'qzweb.cloud', 'localhost', '127.0.0.1'].includes(location.hostname) &&
          location.pathname === '/' && template !== 'vault') {
        const hint = document.createElement('link');
        const width = matchMedia('(max-width: 1280px)').matches ? '1280' : '1672';
        // One format hint only. Browsers without AVIF skip its typed preload and
        // select WebP from the same CSS image-set, avoiding duplicate downloads.
        const format = CSS.supports('background-image', "image-set(url('x.avif') type('image/avif'))") ? 'avif' : 'webp';
        hint.rel = 'preload'; hint.as = 'image'; hint.type = 'image/' + format; hint.fetchPriority = 'high';
        hint.href = '/media/storefront-20261114/jellyfishing-' + width + '.' + format;
        document.head.appendChild(hint);
      }
    } catch {}
  </script>
  <title>π星卡社</title>
</head>

<body>
  <div id="app"></div>
  <script type="module" data-cfasync="false" src="/src/main.ts"></script>
</body>

</html>
