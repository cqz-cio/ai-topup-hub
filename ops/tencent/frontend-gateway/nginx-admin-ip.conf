# Independent management frontend, reachable by IP plus port.
server {
    listen 18888 ssl;
    server_name 124.220.2.69;
    ssl_certificate /srv/zhixiang-front/shared/letsencrypt/live/qzweb-admin-ip/fullchain.pem;
    ssl_certificate_key /srv/zhixiang-front/shared/letsencrypt/live/qzweb-admin-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /srv/zhixiang-front/current/admin;
    index index.html;
    client_max_body_size 20m;
    access_log /var/log/nginx/qzweb-admin-access.log qzweb_front;
    error_log /var/log/nginx/qzweb-admin-error.log warn;
    add_header X-Content-Type-Options nosniff always;
    include /etc/nginx/snippets/qzweb-errors.conf;

    location = /index.html {
        etag off;
        if_modified_since off;
        expires -1;
        try_files $uri =404;
    }

    location ^~ /api/ { include /etc/nginx/snippets/qzweb-backend.conf; }
    location ^~ /uploads/ { include /etc/nginx/snippets/qzweb-backend.conf; }
    location = /health { include /etc/nginx/snippets/qzweb-backend.conf; }
    location ^~ /brand/ {
        root /srv/zhixiang-front/current/user;
        try_files $uri =404;
    }
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location ~ /\. { deny all; }
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
